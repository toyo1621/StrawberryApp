name: Mobile Store Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      submit:
        description: Submit the completed build to the selected store
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-store-release
  cancel-in-progress: false

jobs:
  native-validation:
    if: inputs.platform != 'android'
    uses: ./.github/workflows/ios-native-validation.yml

  release:
    needs: native-validation
    if: ${{ always() && (needs.native-validation.result == 'success' || needs.native-validation.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: mobile-production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_RANKINGS_API_URL: https://strawberry-rankings-api.toyo1621.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate owner setup and reviewed release branch
        run: node scripts/validate-mobile-release.mjs "${{ inputs.platform }}" "${{ inputs.submit }}"

      - name: Validate project and native bundles
        run: npm run check && npm run doctor && npm run build:native-bundles && npm run check:native-build

      - name: Validate EAS project ownership
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@19.1.0 account:view --non-interactive

      - name: Build signed store artifact
        run: |
          mkdir -p .tmp
          npx --yes eas-cli@19.1.0 build --platform "${{ inputs.platform }}" --profile production --non-interactive --wait --json > .tmp/mobile-builds.json

      - name: Submit only artifacts from this build
        if: inputs.submit
        run: node scripts/submit-mobile-builds.mjs .tmp/mobile-builds.json "${{ inputs.platform }}"

      - name: Preserve exact store build identities
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mobile-build-identities
          path: .tmp/mobile-builds.json
          if-no-files-found: ignore
          retention-days: 7
