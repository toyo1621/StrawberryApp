appId: com.strawberrygame.app
---
- launchApp:
    clearState: true
- assertVisible: つめチャレ！
- takeScreenshot: home-portrait
- scrollUntilVisible:
    element:
      id: player-name
    waitToSettleTimeoutMs: 500
- tapOn:
    id: player-name
    waitToSettleTimeoutMs: 500
- inputText: NativeQA
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: game-choice-1
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: game-choice-1
- assertVisible:
    id: game-choice-2
- tapOn:
    text: '選択肢[12]、(いちご|ショートケーキ|ホールケーキ)'
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: game-score
    direction: UP
    waitToSettleTimeoutMs: 500
- copyTextFrom:
    id: game-score
- evalScript: '${output.score = maestro.copiedText}'
- runFlow:
    when:
      'true': '${DEVICE_FAMILY === ''iPad''}'
    commands:
      - setOrientation: LANDSCAPE_LEFT
      - scrollUntilVisible:
          element:
            id: game-score
          direction: UP
          waitToSettleTimeoutMs: 500
      - assertVisible: '${output.score}'
      - takeScreenshot: game-landscape
- takeScreenshot: strawberry
- scrollUntilVisible:
    element: ゲームをやめてホームに戻る
    direction: UP
    waitToSettleTimeoutMs: 500
- tapOn:
    text: ゲームをやめてホームに戻る
    waitToSettleTimeoutMs: 500
- runFlow:
    when:
      'true': '${DEVICE_FAMILY === ''iPad''}'
    commands:
      - setOrientation: PORTRAIT
- tapOn:
    text: 島モードを選択
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: 島モードでゲームを開始
    waitToSettleTimeoutMs: 500
- tapOn:
    text: 島モードでゲームを開始
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: game-choice-1
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: game-choice-1
- assertVisible:
    id: game-choice-2
- takeScreenshot: islands
- tapOn:
    id: game-choice-1
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: ゲームをやめてホームに戻る
    direction: UP
    waitToSettleTimeoutMs: 500
- tapOn:
    text: ゲームをやめてホームに戻る
    waitToSettleTimeoutMs: 500
- tapOn:
    text: 国旗モードを選択
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: 国旗モードでゲームを開始
    waitToSettleTimeoutMs: 500
- tapOn:
    text: 国旗モードでゲームを開始
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: game-choice-1
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: game-choice-1
- assertVisible:
    id: game-choice-2
- takeScreenshot: flags
- tapOn:
    id: game-choice-1
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: ゲームをやめてホームに戻る
    direction: UP
    waitToSettleTimeoutMs: 500
- tapOn:
    text: ゲームをやめてホームに戻る
    waitToSettleTimeoutMs: 500
- tapOn:
    text: 色モードを選択
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: 色モードでゲームを開始
    waitToSettleTimeoutMs: 500
- tapOn:
    text: 色モードでゲームを開始
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: game-choice-1
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: game-choice-1
- assertVisible:
    id: game-choice-2
- takeScreenshot: colors
- tapOn:
    id: game-choice-1
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: ゲーム終了
    timeout: 40000
- takeScreenshot: result
- scrollUntilVisible:
    element: ホームに戻る
    waitToSettleTimeoutMs: 500
- tapOn:
    text: ホームに戻る
    waitToSettleTimeoutMs: 500
- stopApp
- launchApp
- assertVisible: NativeQA
- scrollUntilVisible:
    element: マイページを開く
    waitToSettleTimeoutMs: 500
- tapOn:
    text: マイページを開く
    waitToSettleTimeoutMs: 500
- assertVisible: NativeQA
- scrollUntilVisible:
    element: 設定を開く
    waitToSettleTimeoutMs: 500
- tapOn:
    text: 設定を開く
    waitToSettleTimeoutMs: 500
- assertVisible: オンラインランキングへ参加
- takeScreenshot: settings
